name: Engine integration fixtures
on:
  push:
    paths: ['backend/**', 'integration/**', 'pyproject.toml', 'uv.lock', '.github/workflows/adapters.yml']
  pull_request:
    paths: ['backend/**', 'integration/**', 'pyproject.toml', 'uv.lock', '.github/workflows/adapters.yml']
  workflow_dispatch:
jobs:
  relational:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: postgresql, service: postgres}
          - {engine: mysql, service: mysql}
          - {engine: mariadb, service: mariadb}
          - {engine: sqlserver, service: sqlserver}
          - {engine: cockroachdb, service: cockroachdb}
          - {engine: mongodb, service: mongodb}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: docker compose -p qot-adapters -f integration/compose.yml up -d ${{ matrix.service }}
      - run: uv run python integration/verify.py ${{ matrix.engine }} --output integration-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'engine-${{ matrix.engine }}', path: integration-result.json}
      - run: docker compose -p qot-adapters -f integration/compose.yml down -v
        if: always()
  firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: docker compose -p qot-adapters -f integration/compose.yml up -d --build firebase
      - run: uv run python integration/verify.py firestore firebase_realtime sqlite --output integration-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: engine-firebase-sqlite, path: integration-result.json}
      - run: docker compose -p qot-adapters -f integration/compose.yml down -v
        if: always()
