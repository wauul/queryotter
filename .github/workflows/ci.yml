name: QueryOtter CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: uv sync --locked --python 3.12
      - name: Start disposable PostgreSQL
        run: |
          npm run postgres > /tmp/queryotter-postgres.log 2>&1 &
          for i in $(seq 1 30); do test -f .data/postgres/postmaster.pid && break; sleep 1; done
      - run: uv run pytest -q
      - run: npm run build
      - run: npm run test:proxy
      - run: npm run test:theme
      - run: npm run test:i18n
      - name: Build and exercise cloud container
        run: |
          docker build -t queryotter-worker .
          uv run python - <<'PY'
          from dotenv import dotenv_values
          from pathlib import Path
          values = dotenv_values('.env')
          values['JOB_DATABASE_URL'] = values['EXPERIMENT_DATABASE_URL']
          values['PORT'] = '8001'
          Path('.data/container.env').write_text(''.join(f'{k}={v}\n' for k,v in values.items()))
          PY
          docker run --detach --network host --env-file .data/container.env --name queryotter-health queryotter-worker
          for i in $(seq 1 45); do curl --fail --silent http://127.0.0.1:8001/healthz && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8001/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8001/api/jobs)" = "401"
          docker logs queryotter-health
          docker stop queryotter-health
