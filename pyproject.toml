[project]
name = "queryotter"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlglot>=27,<29",
    "httpx>=0.28,<1",
    "cryptography>=45,<47",
    "python-dotenv>=1,<2",
    "certifi>=2025,<2027",
    "pymysql>=1.1,<1.2",
    "pymongo>=4.14,<5",
    "python-tds>=1.16,<2",
    "google-cloud-firestore>=2.21,<3",
    "google-auth>=2.40,<3",
    "authlib>=1.6,<2",
    "dnspython>=2.8,<3",
    "pyopenssl>=25,<27",
]
[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.16.9",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
