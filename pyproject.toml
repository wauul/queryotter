[project]
name = "queryotter"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1", "psycopg[binary]>=3.2,<4", "sqlglot>=27,<29", "httpx>=0.28,<1", "cryptography>=45,<47", "python-dotenv>=1,<2"]
[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.16.9",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
